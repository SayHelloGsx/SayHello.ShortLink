name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: host/src/SayHello.ShortLink.WebHost.Web/yarn.lock

      - name: Install ABP CLI and Yarn
        shell: bash
        run: |
          dotnet tool install --global Volo.Abp.Cli \
            --version 10.6.0 \
            --add-source https://packagefeedproxy.microsoft.io/nuget/v3/index.json \
            --ignore-failed-sources
          npm install --global yarn@1.22.22

      - name: Restore .NET dependencies
        run: dotnet restore SayHello.ShortLink.slnx

      - name: Restore MVC client libraries
        run: abp install-libs --working-directory host/src/SayHello.ShortLink.WebHost.Web

      - name: Build
        run: dotnet build SayHello.ShortLink.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test SayHello.ShortLink.slnx --configuration Release --no-build --no-restore

      - name: Audit NuGet dependencies
        run: dotnet list SayHello.ShortLink.slnx package --vulnerable --include-transitive
