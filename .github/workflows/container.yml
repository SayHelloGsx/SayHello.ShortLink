name: Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: host/src/SayHello.ShortLink.WebHost.Web/yarn.lock

      - name: Install ABP CLI and Yarn
        shell: bash
        run: |
          dotnet tool install --global Volo.Abp.Cli \
            --version 10.6.0 \
            --add-source https://packagefeedproxy.microsoft.io/nuget/v3/index.json \
            --ignore-failed-sources
          npm install --global yarn@1.22.22

      - name: Restore .NET dependencies
        run: dotnet restore SayHello.ShortLink.slnx

      - name: Restore MVC client libraries
        run: abp install-libs --working-directory host/src/SayHello.ShortLink.WebHost.Web

      - name: Build and test
        shell: bash
        run: |
          dotnet build SayHello.ShortLink.slnx --configuration Release --no-restore
          dotnet test SayHello.ShortLink.slnx --configuration Release --no-build --no-restore

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: printf 'name=%s\n' "${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload scan results
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
